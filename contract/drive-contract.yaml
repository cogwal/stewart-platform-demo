# CANopen contract between the master (PC or ECU) and the TMCM-1270 drives.
# Both the drive emulator and the master build against this file.
# Readable version and rationale: contract/README.md. Sources: docs/hardware-notes.md.
#
# Values marked "provisional" are placeholders until the bench measurements in S5.

contract_version: 0.1.0

device:
  name: TMCM-1270
  firmware: "3.27"
  eds: eds/TMCM-1270_V3.27.eds          # vendor file, unmodified
  defaults_overlay: defaults-overlay.yaml
  identity:                             # checked by the master before configuring
    vendor_id: 0x00000286
    product_code: 1270
    min_revision: 0x0003001B            # fw 3.27 (EDS RevisionNumber)

bus:
  bitrate: 1000000
  master_node_id: 127
  drive_node_ids: [1, 2, 3, 4, 5, 6]     # leg i = drive_node_ids[i] (config/platform.yaml)
  sync:
    cob_id: 0x80
    period_ms: 10                       # = csp cycle; drives' 60C2h is set to match

heartbeat:
  master_producer_ms: 100
  drive_producer_ms: 100                # 1017h
  drive_consumes_master_ms: 300         # 1016h.1: drive faults if the master goes silent
  master_consumes_drive_ms: 300         # master marks a drive lost after this

timeouts_ms:
  boot_up: 5000                         # wait for boot-up after power-on / NMT reset node
  sdo: 500                              # per SDO transfer
  state_transition: 500                 # per CiA 402 state change

units:
  microstep_exponent: 8                 # 2000h: 2^8 = 256 microsteps per full step
  full_steps_per_mm: 100                # S20: 0.01 mm per full step
  counts_per_mm: 25600                  # = 100 * 2^8; positions (607Ah, 6064h) are microsteps
  velocity_dimension: 181               # 208Ch: velocities in PPS, accelerations in PPS/s

actuator:
  model: S20-100-38-B
  stroke_mm: 100
  soft_limits_mm: [0.5, 99.5]           # 607Dh, relative to home (retracted end stop = 0)

current:                                # 2003h/2004h: 0..255 = 0..100 % of drive max (32 steps of 8)
  run: 88                               # ~0.41 A RMS at 1.2 A full scale = 0.6 A peak (S20 limit taken as peak)
  homing: 48                            # provisional: reduced current while pushing into the end stop
  standby: 32                           # provisional
  standby_delay_10ms: 100               # 2089h: 1 s standstill before standby current

profile:                                # pp mode and quick stop (provisional until S5)
  velocity_mm_s: 5.0                    # 6081h
  acceleration_mm_s2: 20.0              # 6083h
  deceleration_mm_s2: 20.0              # 6084h
  quick_stop_deceleration_mm_s2: 50.0   # 6085h
  quick_stop_option: 2                  # 605Ah: quick-stop ramp, then switch on disabled

csp:
  max_velocity_mm_s: 10.0               # master-side rate limit on streamed targets (provisional)
  max_acceleration_mm_s2: 50.0          # master-side (provisional)

homing:                                 # retract into the end stop, detect stall, then method 35
  method: 35                            # 6098h: current position = home, no motion
  mode_for_travel: 3                    # pv
  direction: negative                   # retract
  velocity_mm_s: 4.0                    # 60FFh during travel (provisional)
  stall_threshold: 0                    # 209Eh, -63..63, lower = more sensitive (tune in S5)
  stop_on_stall_above_mm_s: 2.0         # 20A4h: stallGuard stop active above this speed
  load_poll_ms: 50                      # master polls 2101h (not PDO-mappable) during travel
  load_stall_threshold: 10              # 2101h <= this while travelling = end stop reached (provisional)
  timeout_s: 30                         # > 105 mm / 4 mm/s: blind overtravel guarantees the stop
  all_legs_together: true
  park_mm: 5.0                          # after method 35 (leg at 0 mm, below the soft limit): pp move here, then csp

chopper:
  mode: 0                               # 2093h: spreadCycle (needed for stallGuard2)
  stealthchop_threshold: 0              # 20B0h: 0 = stealthChop off

switches: 0x13                          # 2005h: left, right and home inputs disabled (none wired)

# ---------------------------------------------------------------------------------------------
# PDOs. Max 3 mapped objects per PDO (drive limit). COB-ID = base + node ID.
# Manual quirk: bit 30 (no RTR) must always be set; bit 31 = PDO disabled.
# Mapping entries are [index, subindex]; sizes come from the EDS.
# ---------------------------------------------------------------------------------------------
pdo:
  rpdo:
    - num: 1
      base: 0x200
      transmission: 0xFF                # asynchronous: act on arrival (RPDO SYNC support unclear, test in S5)
      map: [[0x6040, 0], [0x607A, 0]]   # controlword + target position (csp stream, pp target)
    - num: 2
      base: 0x300
      transmission: 0xFF
      map: [[0x6040, 0], [0x6060, 0]]   # controlword + mode of operation
    - num: 3
      base: 0x400
      transmission: 0xFF
      map: [[0x6040, 0], [0x60FF, 0]]   # controlword + target velocity (pv homing travel)
    - num: 4
      base: 0x500
      enabled: false
  tpdo:
    - num: 1
      base: 0x180
      transmission: 1                   # every SYNC
      map: [[0x6041, 0], [0x6064, 0]]   # statusword + actual position
    - num: 2
      base: 0x280
      transmission: 0xFF                # on change
      inhibit_100us: 50                 # at most every 5 ms
      event_timer_ms: 0
      map: [[0x6041, 0], [0x6061, 0]]   # statusword + mode display
    - num: 3
      base: 0x380
      enabled: false                    # default was SYNC-driven 6041+6064: disabled to save bus load
    - num: 4
      base: 0x480
      enabled: false                    # default was SYNC-driven 6041+606C

# ---------------------------------------------------------------------------------------------
# CiA 402 (drive state machine), from the firmware manual.
# ---------------------------------------------------------------------------------------------
cia402:
  controlword:
    shutdown: 0x0006
    switch_on: 0x0007
    enable_operation: 0x000F
    disable_voltage: 0x0000
    quick_stop: 0x0002
    fault_reset: 0x0080                 # rising edge of bit 7
    new_set_point: 0x0010               # pp: bit 4 rising edge starts the move
  statusword:                           # [mask, value]
    not_ready_to_switch_on: [0x004F, 0x0000]
    switch_on_disabled: [0x004F, 0x0040]
    ready_to_switch_on: [0x006F, 0x0021]
    switched_on: [0x006F, 0x0023]
    operation_enabled: [0x006F, 0x0027]
    quick_stop_active: [0x006F, 0x0007]
    fault_reaction_active: [0x004F, 0x000F]
    fault: [0x004F, 0x0008]
  statusword_bits:
    target_reached: 10
    set_point_acknowledged: 12          # pp; in csp: target position used
    motor_active: 14                    # Trinamic-specific
  modes:
    profile_position: 1
    profile_velocity: 3
    homing: 6
    cyclic_sync_position: 8

# ---------------------------------------------------------------------------------------------
# What the master does with each EMCY code. Classes:
#   info             log only
#   warn             log, show on the status display
#   homing_stall     expected during homing travel (end stop reached); otherwise treated as stall
#   stall            stop all legs, mark all unhomed, re-home
#   stop_all         quick-stop all legs, wait for the operator
#   stop_all_rehome  quick-stop all legs, mark unhomed, re-home after the operator acknowledges
#   config_error     contract/master bug: stop all, do not retry automatically
# ---------------------------------------------------------------------------------------------
emcy:
  - {code: 0x0000, class: info, text: fault reset executed}
  - {code: 0x1000, class: stop_all, text: open load (byte 1 = bridge A/B)}
  - {code: 0x2310, class: stop_all, text: overcurrent high side}
  - {code: 0x2311, class: stop_all, text: overcurrent bridge B}
  - {code: 0x2312, class: stop_all, text: overcurrent bridge A}
  - {code: 0x3230, class: homing_stall, text: stallGuard2 stall}
  - {code: 0x4310, byte1: 1, class: warn, text: overtemperature pre-warning}
  - {code: 0x4310, byte1: 2, class: stop_all_rehome, text: overtemperature shutdown}
  - {code: 0x5441, class: stop_all_rehome, text: ENN missing (enable / e-stop)}
  - {code: 0x6320, class: config_error, text: PDO parameter error}
  - {code: 0x8100, class: warn, text: CAN communication error}
  - {code: 0x8110, class: warn, text: CAN overflow (byte 1 = controller / Tx / Rx)}
  - {code: 0x8120, class: warn, text: CAN error passive}
  - {code: 0x8130, class: stop_all, text: drive lost the master heartbeat}
  - {code: 0x8140, class: stop_all_rehome, text: recovered from bus-off (drive was stopped and disabled)}
  - {code: 0x8210, class: config_error, text: PDO too short}
  - {code: 0x8220, class: config_error, text: PDO too long}
  - {code: 0x8611, class: stop_all, text: following error (needs an encoder; not expected)}
  - {code: 0xFF00, class: stop_all_rehome, text: undervoltage}
  - {code: 0xFF01, class: config_error, text: software limit (byte 1 = 1/2) or limit switch (3/4)}
