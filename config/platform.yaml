# Stewart platform: geometry, motion limits and operator input mapping.
#
# PROVISIONAL. The CAD model is not available yet; these numbers are a plausible 6-6 layout sized
# around the S20-100 stroke. Replacing them with the CAD values is a self-contained task:
# docs/agents/cad-geometry.md. Everything downstream (Python sim, web view, generated C header,
# tests) reads this file, so only this file changes.
#
# Frames: base frame origin at the centre of the base joint circle, z up. Platform frame origin at
# the centre of the platform joint circle. Pose = platform frame relative to the base frame.
# Leg i joins base joint B[i] to platform joint P[i] and is driven by drive bus.drive_node_ids[i].

geometry_version: 0.1.0-provisional

base:
  radius_mm: 120.0
  half_angle_deg: 10.0        # joint i at 120*floor(i/2) -/+ half_angle (pairs at 0, 120, 240 deg)
  z_mm: 0.0
platform:
  radius_mm: 80.0
  half_angle_deg: 50.0        # same formula; pairs end up at 60, 180, 300 deg (classic zig-zag)
  z_mm: 0.0
# Optional: explicit joint coordinates from CAD override the circle layout above.
# base_joints_mm:     [[x, y, z], ... 6 entries]
# platform_joints_mm: [[x, y, z], ... 6 entries]

leg:
  # Pin-to-pin length at 0 mm stroke (retracted end stop = home zero). S20-100 hole-to-hole is
  # 174.8 mm; joint hardware adds to it. Provisional: hole-to-hole only.
  closed_length_mm: 174.8
  stroke_mm: 100.0            # must match contract actuator.stroke_mm

# Neutral pose: platform level and centred, at the height where every leg is at neutral_stroke_mm.
neutral_stroke_mm: 50.0

motion:
  # Operator pose limits, relative to the neutral pose (before the workspace check).
  limits:
    x_mm: 25.0
    y_mm: 25.0
    z_mm: 30.0
    roll_deg: 12.0
    pitch_deg: 12.0
    yaw_deg: 15.0
  # Pose smoothing (per axis, applied before inverse kinematics).
  max_linear_velocity_mm_s: 15.0
  max_linear_acceleration_mm_s2: 60.0
  max_angular_velocity_deg_s: 10.0
  max_angular_acceleration_deg_s2: 40.0
  # Legs stay this far inside the contract soft limits; poses beyond are scaled back toward neutral.
  workspace_margin_mm: 1.0

inputs:
  joystick:                   # analog joystick on the ECU, axes normalised to -1..1
    mapping: tilt             # x -> roll, y -> pitch (open question: docs/plan.md "Still open")
    deadband: 0.05
    expo: 0.3                 # 0 = linear, 1 = cubic
    roll_deg: 10.0
    pitch_deg: 10.0
  imu:                        # platform mirrors the IMU orientation
    gain: 1.0
    use_yaw: false
    clamp_deg: 12.0
  demo:                       # idle demo motion (open question: idle behaviour)
    idle_after_s: 0           # 0 = only when selected; > 0 = start after this long without input
    roll_deg: 6.0
    pitch_deg: 6.0
    z_mm: 10.0
    period_s: 12.0

supervisor:                   # unattended operation (fair). Open question: docs/agents/fair-features.md
  auto_recover_after_s: 0     # 0 = off (operator presses Resume / Home). > 0: after a stop or fault, wait this
                              # long, then Resume (homing kept) or Home (homing lost), if all drives are back
  auto_recover_max_tries: 3   # per incident; reset after 60 s of uninterrupted running

simulation:                   # emulator only (the master doesn't use this)
  payload_kg: 0.0             # 0 = no force model. Mass on the platform (fair payload: open question)
  platform_mass_kg: 0.5       # top plate + joints (provisional)
  com_above_platform_mm: 20.0 # centre of mass above the platform joint plane
  s20_max_force_n: 60.0       # PROVISIONAL: datasheet force/speed curve unverified; 60 N = powered backdrive force
  s20_force_derate_at_10mm_s: 0.3   # fraction of max force lost at 10 mm/s (linear in speed)
